version: '3.8'

services:
  postgres:
    container_name: postgres_go
    image: postgres:17
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: postgres
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    ports:
      - "4321:5432"
    # Добавляем проверку готовности базы данных
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 5

  link-cutter:
    container_name: link_cutter_app
    build: .
    ports:
      - "8081:8081"
    # Указываем запускать приложение строго ПОСЛЕ успешного прохождения healthcheck базы
    depends_on:
      postgres:
        condition: service_healthy